name: secret-scope-test
on:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: secret presence probe (prints ONLY empty/present, never the value)
        env:
          DUMMY: ${{ secrets.DUMMY_SECRET }}
        run: |
          if [ -z "$DUMMY" ]; then echo "RESULT=SECRET_EMPTY"; else echo "RESULT=SECRET_PRESENT"; fi
          echo "event=${{ github.event_name }} head_repo=${{ github.event.pull_request.head.repo.full_name }} base=${{ github.repository }}"
